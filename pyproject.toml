[project]
name = "ledgerlens"
version = "0.1.0"
description = "Local, rule-based bank statement analyzer with interactive HTML reports"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "aiofiles>=25.1.0",
    "fastapi>=0.134.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pandas>=3.0.1",
    "plotly>=6.5.2",
    "pytest>=9.0.2",
    "python-multipart>=0.0.22",
    "uvicorn>=0.41.0",
]

[tool.mypy]
files = ["app", "main.py", "test_pipeline.py", "tests"]
ignore_missing_imports = true
python_version = "3.14"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
pythonpath = ["."]
addopts = "-v --tb=short"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "ruff>=0.16.9",
]
